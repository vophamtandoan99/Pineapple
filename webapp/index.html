<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TFS Report</title>
<style>
  :root {
    --bg: #f4f6fa; --card: #fff; --line: #dde3ec; --text: #1f2937;
    --muted: #6b7280; --brand: #2563eb; --brand-dark: #1e40af;
    --ok: #16a34a; --bad: #dc2626; --chip-bg: #eef2ff;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: system-ui, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh;
    display: flex; justify-content: center; padding: 32px 16px;
  }
  .wrap { width: 100%; }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  header h1 { font-size: 20px; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 24px; box-shadow: 0 1px 3px rgba(0,0,0,.06);
  }
  .hidden { display: none !important; }
  label { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin: 12px 0 4px; }
  input[type=text], input[type=password], input[type=date] {
    width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px;
    font-size: 14px; background: #fff;
  }
  input:focus { outline: 2px solid var(--brand); outline-offset: -1px; }
  button {
    background: var(--brand); color: #fff; border: 0; border-radius: 8px;
    padding: 10px 20px; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 16px;
  }
  button:hover { background: var(--brand-dark); }
  button.ghost { background: transparent; color: var(--brand); border: 1px solid var(--brand); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .msg { margin-top: 12px; font-size: 13px; min-height: 18px; }
  .msg.err { color: var(--bad); }
  .msg.ok { color: var(--ok); }

  /* split: list + preview cùng hàng */
  .split { display: flex; gap: 12px; align-items: stretch; }
  .split > .items { flex: 1 1 60%; min-width: 0; }
  .split > #previewPanel { flex: 1 1 40%; margin: 0; display: flex; flex-direction: column; min-width: 0; }
  .split > #previewPanel .preview-md { flex: 1; min-height: 380px; }
  @media (max-width: 900px) { .split { flex-direction: column; } }

  /* live preview panel */
  .preview-panel { margin: 12px 0; }
  .preview-tabs { display: flex; gap: 6px; margin-bottom: 6px; }
  .preview-tabs .tab {
    padding: 4px 12px; border: 1px solid var(--line); border-radius: 99px;
    font-size: 12px; cursor: pointer; background: #fff; color: var(--muted);
  }
  .preview-tabs .tab.active { background: var(--brand); color: #fff; border-color: var(--brand); }
  .copy-btn { margin-left: auto; padding: 4px 12px; font-size: 12px; }
  .preview-md {
    background: #0f172a; color: #e2e8f0; border-radius: 10px; padding: 14px;
    font-size: 12px; line-height: 1.55; max-height: 320px; overflow: auto;
    margin: 0; white-space: pre-wrap; font-family: ui-monospace, "SF Mono", Menlo, monospace;
  }

  /* password eye toggle */
  .pass-wrap { position: relative; }
  .pass-wrap input { padding-right: 44px; }
  .eye {
    position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
    background: transparent; border: 0; padding: 6px; margin: 0; cursor: pointer;
    color: var(--muted); display: flex; align-items: center;
  }
  .eye:hover { color: var(--text); background: transparent; }
  button.ghost.active { background: var(--chip-bg); border-color: var(--brand); color: var(--brand-dark); }

  /* stats */
  .stats { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  .stat-box { flex: 1 1 200px; border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; background: #fff; }
  .stat-box h3 { font-size: 12px; color: var(--muted); text-transform: uppercase; margin-bottom: 8px; }
  table.mini { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.mini td, table.mini th { border: 1px solid var(--line); padding: 3px 8px; text-align: left; }
  table.mini td:last-child, table.mini th:last-child { text-align: right; }

  /* toolbar */
  .toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  .toolbar input[type=text] { width: 260px; }
  .toolbar select { padding: 8px; border: 1px solid var(--line); border-radius: 8px; background: #fff; font-size: 13px; }
  .count { color: var(--muted); font-size: 13px; margin-left: auto; }

  /* item table */
  .items { max-height: 420px; overflow: auto; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
  table.list { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.list th {
    position: sticky; top: 0; background: #f8fafc; text-align: left;
    border-bottom: 1px solid var(--line); padding: 8px; font-size: 12px; color: var(--muted);
  }
  table.list td { border-bottom: 1px solid #eef1f6; padding: 6px 8px; vertical-align: top; }
  table.list tr:hover td { background: #f6f9ff; }
  tr.sel td { background: var(--chip-bg); }
  .id { font-weight: 700; white-space: nowrap; }
  .chip { display: inline-block; padding: 1px 8px; border-radius: 99px; font-size: 11px; font-weight: 600; }
  .st-New { background: #dbeafe; color: #1e40af; }
  .st-Active { background: #fef3c7; color: #92400e; }
  .st-Resolved { background: #dcfce7; color: #166534; }
  .st-Closed { background: #e5e7eb; color: #4b5563; }
  .st-Removed { background: #fee2e2; color: #991b1b; }
  .t-Bug { background: #ffe4e6; color: #9f1239; }
  .t-Task { background: #e0f2fe; color: #075985; }
  .t-User_Story { background: #f3e8ff; color: #6b21a8; }
  .title { max-width: 420px; }

  /* result */
  pre.preview {
    background: #0f172a; color: #e2e8f0; border-radius: 10px; padding: 16px;
    font-size: 12px; overflow: auto; max-height: 380px; margin-top: 12px; white-space: pre-wrap;
  }
  .datepick { display: flex; gap: 12px; align-items: center; margin: 14px 0 4px; flex-wrap: wrap; }
  .datepick input[type=date] { width: auto; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>TFS Report</h1>
    <button class="ghost hidden" id="btnLogout" onclick="logout()">Đăng xuất</button>
  </header>

  <!-- LOGIN -->
  <div class="card" id="viewLogin" style="max-width:380px">
    <h2 style="font-size:16px;margin-bottom:4px">Đăng nhập TFS</h2>
    <label>Username</label>
    <input type="text" id="inUser" placeholder="ví dụ doanvpt" autocomplete="username">
    <label>Mật khẩu</label>
    <div class="pass-wrap">
      <input type="password" id="inPass" autocomplete="current-password">
      <button type="button" class="eye" id="eyeBtn" onclick="togglePass()" aria-label="Hiện mật khẩu">
        <svg id="eyeIcon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
        </svg>
      </button>
    </div>
    <button style="width:100%" id="btnLogin" onclick="login()">Đăng nhập</button>
    <div class="msg" id="loginMsg"></div>
  </div>

  <!-- PICKER -->
  <div id="viewPick" class="hidden">
    <div class="stats" id="stats"></div>
    <div class="card">
      <div class="toolbar">
        <input type="text" id="search" placeholder="Tìm theo ID hoặc tiêu đề..." oninput="renderList()">
        <select id="filterState" onchange="renderList()"><option value="">Mọi State</option></select>
        <button class="ghost" onclick="toggleAll()" id="btnAll">Chọn tất cả (hôm nay)</button>
        <button class="ghost" onclick="clearPick()" id="btnClear">🗑 Clear</button>
        <button class="ghost" onclick="togglePreview()" id="btnPreview">👁 Preview</button>
        <span class="count" id="pickCount">Đã chọn 0</span>
      </div>
      <div class="split">
        <div class="items">
          <table class="list">
            <thead><tr><th title="Công việc hôm nay" style="width:44px">Hôm nay</th><th title="Công việc ngày tiếp theo" style="width:44px">Mai</th><th>ID</th><th>Type</th><th>State</th><th>Changed</th><th>Title</th></tr></thead>
            <tbody id="itemRows"></tbody>
          </table>
        </div>
        <div id="previewPanel" class="preview-panel hidden">
          <div class="preview-tabs">
            <span class="tab active" data-tab="chat" onclick="switchTab('chat')">Chat</span>
            <span class="tab" data-tab="lark" onclick="switchTab('lark')">Lark</span>
            <span class="tab" data-tab="full" onclick="switchTab('full')">Full</span>
            <button class="ghost copy-btn" onclick="copyPreview()" id="btnCopyPreview">📋 Copy</button>
          </div>
          <pre class="preview-md" id="previewMd"></pre>
        </div>
      </div>

      <div class="datepick">
        <label style="margin:0">Ngày report</label>
        <input type="date" id="reportDate" oninput="renderPreview()">
        <button id="btnToday" class="ghost" style="margin:0;padding:6px 12px" onclick="document.getElementById('reportDate').value = todayStr(); renderPreview()">Hôm nay</button>
      </div>
      <button id="btnReport" onclick="makeReport()">Tạo report</button>
      <div class="msg" id="pickMsg"></div>
    </div>
  </div>

  <!-- RESULT -->
  <div id="viewDone" class="card hidden">
    <h2 style="font-size:16px" id="doneTitle"></h2>
    <div class="msg ok" id="donePath"></div>
    <button class="ghost" onclick="showPick()">← Chọn lại item</button>
    <button class="ghost" onclick="copyText($('preview').textContent, this)">📋 Copy report</button>
    <pre class="preview" id="preview"></pre>
  </div>
</div>

<script>
let ITEMS = [], PICKED = {today: new Set(), next: new Set()}, PREVIEW_OPEN = false, PREVIEW_TAB = "chat";
const SERVER = (() => { const u = new URL(location.href); return { host: u.host }; })();
const TASK_BASE = `${SERVER.host}/_workitems/edit/`; // fallback; real base from items

const $ = id => document.getElementById(id);
const todayStr = () => {
  const d = new Date(), p = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
};

async function login() {
  const msg = $("loginMsg");
  msg.className = "msg"; msg.textContent = "Đang đăng nhập...";
  $("btnLogin").disabled = true;
  try {
    const r = await fetch("/api/login", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({user: $("inUser").value.trim(), password: $("inPass").value})
    });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || "Lỗi đăng nhập");
    msg.textContent = "";
    await afterLogin();
  } catch (e) {
    msg.className = "msg err"; msg.textContent = e.message;
  } finally { $("btnLogin").disabled = false; }
}

async function afterLogin() {
  $("viewLogin").classList.add("hidden");
  $("viewPick").classList.remove("hidden");
  $("btnLogout").classList.remove("hidden");
  $("reportDate").value = todayStr();
  $("pickMsg").className = "msg"; $("pickMsg").textContent = "Đang tải work items...";
  const r = await fetch("/api/items");
  if (r.status === 401) { location.reload(); return; }
  const j = await r.json();
  if (j.error) { $("pickMsg").className = "msg err"; $("pickMsg").textContent = j.error; return; }
  ITEMS = j.items;
  window.__fullname = j.fullname;
  window.__taskBase = j.taskBase;
  $("pickMsg").textContent = "";
  renderStats(); renderFilters(); renderList(); renderPreview();
}

function renderStats() {
  const by = key => ITEMS.reduce((m, it) => (m[it[key]] = (m[it[key]]||0)+1, m), {});
  const box = (title, map) => `
    <div class="stat-box"><h3>${title}</h3>
      <table class="mini">${Object.entries(map).sort((a,b)=>b[1]-a[1])
        .map(([k,v]) => `<tr><td>${k}</td><td>${v}</td></tr>`).join("")}</table>
    </div>`;
  $("stats").innerHTML = box("Type", by("type")) + box("State", by("state"));
}

function renderFilters() {
  const states = [...new Set(ITEMS.map(i => i.state))].sort();
  $("filterState").innerHTML = '<option value="">Mọi State</option>' +
    states.map(s => `<option>${s}</option>`).join("");
}

function visible() {
  const q = $("search").value.toLowerCase().trim(), st = $("filterState").value;
  return ITEMS.filter(it =>
    (!st || it.state === st) &&
    (!q || String(it.id) === q || it.title.toLowerCase().includes(q)));
}

function renderList() {
  const rows = visible().map(it => {
    const inToday = PICKED.today.has(it.id), inNext = PICKED.next.has(it.id);
    return `
    <tr class="${(inToday || inNext) ? "sel" : ""}" onclick="toggle(${it.id},'today')">
      <td><input type="checkbox" ${inToday ? "checked" : ""} onclick="event.stopPropagation();toggle(${it.id},'today')"></td>
      <td><input type="checkbox" ${inNext ? "checked" : ""} onclick="event.stopPropagation();toggle(${it.id},'next')"></td>
      <td class="id">${it.id}</td>
      <td><span class="chip t-${it.type.replace(/ /g,"_")}">${it.type}</span></td>
      <td><span class="chip st-${it.state}">${it.state}</span></td>
      <td style="white-space:nowrap">${it.changed}</td>
      <td class="title">${it.title}</td>
    </tr>`;}).join("");
  $("itemRows").innerHTML = rows || '<tr><td colspan="7" style="padding:20px;color:#6b7280;text-align:center">Không có item khớp</td></tr>';
  $("pickCount").textContent = `Hôm nay ${PICKED.today.size} · Mai ${PICKED.next.size}/${ITEMS.length}`;
}

function toggle(id, group) {
  PICKED[group].has(id) ? PICKED[group].delete(id) : PICKED[group].add(id);
  renderList(); renderPreview();
}
function toggleAll() {
  const vis = visible().map(i => i.id);
  const allOn = vis.every(id => PICKED.today.has(id));
  vis.forEach(id => allOn ? PICKED.today.delete(id) : PICKED.today.add(id));
  renderList(); renderPreview();
}
function clearPick() {
  PICKED.today.clear(); PICKED.next.clear();
  renderList(); renderPreview();
}

function escapeMd(s) { return String(s || "").replace(/\|/g, "\\|").replace(/\n/g, " ").trim(); }

function renderMd() {
  const todayItems = ITEMS.filter(it => PICKED.today.has(it.id));
  const nextItems = ITEMS.filter(it => PICKED.next.has(it.id));
  const iso = $("reportDate").value;
  if (!iso) return { chat: "", lark: "", full: "" };
  const [y, m, d] = iso.split("-");
  const who = (window.__fullname || "") || "...";
  const dateStr = `${d}/${m}/${y}`;

  const chatLines = [
    `*Báo cáo nhân sự* ${dateStr}`,
    `*Nhân sự:* ${who}`,
    "*Công việc:*"];
  for (const it of todayItems) chatLines.push(`- ${escapeMd(it.type)} ${it.id}: ${escapeMd(it.title)} (100%)`);
  if (!todayItems.length) chatLines.push("- ...");
  chatLines.push("*Công việc ngày tiếp theo:*");
  for (const it of nextItems) chatLines.push(`- ${escapeMd(it.type)} ${it.id}: ${escapeMd(it.title)}`);
  if (!nextItems.length) chatLines.push("- ...");
  chatLines.push("*Vấn đề:*", "- None");

  const larkItems = [];
  for (const it of [...todayItems, ...nextItems]) if (!larkItems.some(x => x.id === it.id)) larkItems.push(it);
  const larkLines = [
    "| Status | Start date | End date | Note | Type | Task ID | Task Name | Task Link |",
    "| --- | --- | --- | --- | --- | --- | --- | --- |"];
  const base = (window.__taskBase || "");
  for (const it of larkItems) {
    const link = base ? `${base}${it.id}` : `${it.id}`;
    larkLines.push(`| ${escapeMd(it.state)} | ${dateStr} | <none> | <none> | ${escapeMd(it.type)} | ${it.id} | ${escapeMd(it.title)} | ${link} |`);
  }

  const chat = chatLines.join("\n");
  const lark = larkLines.join("\n");
  return { chat, lark, full: chat + "\n\n" + lark };
}

function renderPreview() {
  if (!PREVIEW_OPEN) return;
  const m = renderMd();
  $("previewMd").textContent = m[PREVIEW_TAB] || "(chọn item để xem trước)";
}

function togglePreview() {
  PREVIEW_OPEN = !PREVIEW_OPEN;
  $("previewPanel").classList.toggle("hidden", !PREVIEW_OPEN);
  $("btnPreview").classList.toggle("active", PREVIEW_OPEN);
  if (PREVIEW_OPEN) renderPreview();
}

function switchTab(t) {
  PREVIEW_TAB = t;
  document.querySelectorAll(".preview-tabs .tab").forEach(el => el.classList.toggle("active", el.dataset.tab === t));
  renderPreview();
}

function flashBtn(btn, ok = true) {
  const old = btn.textContent;
  btn.textContent = ok ? "✓ Đã copy" : "✗ Lỗi";
  btn.disabled = true;
  setTimeout(() => { btn.textContent = old; btn.disabled = false; }, 1200);
}

async function copyText(text, btn) {
  try {
    await navigator.clipboard.writeText(text);
    flashBtn(btn, true);
  } catch (e) {
    // fallback cho clipboard API bị chặn (http non-secure ngoài localhost)
    try {
      const ta = document.createElement("textarea");
      ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
      flashBtn(btn, true);
    } catch (e2) {
      flashBtn(btn, false);
    }
  }
}

function copyPreview() { copyText($("previewMd").textContent, $("btnCopyPreview")); }

async function makeReport() {
  const msg = $("pickMsg");
  const iso = $("reportDate").value; // yyyy-mm-dd
  if (!iso) { msg.className = "msg err"; msg.textContent = "Chọn ngày report"; return; }
  if (!PICKED.today.size && !PICKED.next.size) { msg.className = "msg err"; msg.textContent = "Chọn ít nhất 1 item (cột Hôm nay hoặc Mai)"; return; }
  const [y, m, d] = iso.split("-");
  msg.className = "msg"; msg.textContent = "Đang tạo report...";
  $("btnReport").disabled = true;
  try {
    const r = await fetch("/api/report", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ids: [...PICKED.today], next_ids: [...PICKED.next], date: `${d}/${m}/${y}`})
    });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || "Lỗi tạo report");
    $("viewPick").classList.add("hidden");
    $("viewDone").classList.remove("hidden");
    $("doneTitle").textContent = `Report ${j.count} item`;
    $("donePath").textContent = (j.appended ? "Đã update (append): " : "Tạo mới: ") + j.path;
    $("preview").textContent = j.report;
    msg.textContent = "";
  } catch (e) {
    msg.className = "msg err"; msg.textContent = e.message;
  } finally { $("btnReport").disabled = false; }
}

function showPick() { $("viewDone").classList.add("hidden"); $("viewPick").classList.remove("hidden"); }

async function logout() {
  await fetch("/api/logout", {method: "POST"});
  PICKED.today.clear(); PICKED.next.clear();
  $("viewPick").classList.add("hidden");
  $("viewDone").classList.add("hidden");
  $("viewLogin").classList.remove("hidden");
  $("btnLogout").classList.add("hidden");
  $("inPass").value = "";
}

$("inPass").addEventListener("keydown", e => { if (e.key === "Enter") login(); });

function togglePass() {
  const i = $("inPass"), ic = $("eyeIcon");
  const showing = i.type === "text";
  i.type = showing ? "password" : "text";
  ic.innerHTML = showing
    ? '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>'
    : '<path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a19.6 19.6 0 0 1 4.06-5.94"/><path d="M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a19.5 19.5 0 0 1-3.17 4.19"/><path d="M14.12 14.12A3 3 0 0 1 9.88 9.88"/><line x1="1" y1="1" x2="23" y2="23"/>';
}
</script>
</body>
</html>
